[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

# Supported native defaults; the in-app toggle applies a session-local CSS palette.
[theme]
base = "light"
primaryColor = "#b7322c"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#202830"
borderColor = "#d4dce4"
font = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
headingFont = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Consolas, monospace"
baseFontSize = 18
baseRadius = "6px"
